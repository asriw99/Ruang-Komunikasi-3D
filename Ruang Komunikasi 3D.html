<style>
/* Layout: panggung 3D di kiri, panel misi di kanan; di ponsel ditumpuk. Satu dunia visual: ruang lab gelap dengan 7 warna unsur. */
:root{
  --bg:#0b1020; --panel:#121a31; --panel2:#19234a; --line:#2b365c; --fg:#e9edfa; --muted:#9aa7cc;
  --sumber:#4f8cff; --pesan:#ffb547; --saluran:#4fd18b; --penerima:#a493ff; --efek:#ff7a90; --umpan:#22c3d6; --gangguan:#ff6b6b;
  --ok:#5be28a; --warn:#ffb547;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:10px;background:conic-gradient(from 200deg,var(--sumber),var(--pesan),var(--saluran),var(--penerima),var(--efek),var(--sumber));position:relative}
.mark::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
h1{font:700 19px/1.1 var(--display);margin:0;letter-spacing:.1px}
.sub{margin:2px 0 0;font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
#steps{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.step{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;font:500 12.5px var(--body);cursor:pointer;display:flex;gap:6px;align-items:center}
.step i{font:500 11px var(--mono);font-style:normal;opacity:.8}
.step[aria-current="step"]{background:var(--panel2);color:var(--fg);border-color:#4a5a92}
.step.done i{color:var(--ok)}
.step:disabled{opacity:.4;cursor:not-allowed}
.tools{display:flex;gap:8px;align-items:center}
#clock{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:12px}
#stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:260px;background:#0b1020}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.hud{position:absolute;left:10px;right:10px;pointer-events:none;display:flex;gap:8px;align-items:flex-start}
.hud.top{top:10px}
.hud.bot{bottom:10px;align-items:flex-end;justify-content:space-between}
.pill{pointer-events:auto;background:rgba(11,16,32,.78);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px;color:var(--fg);backdrop-filter:blur(6px)}
.pill.mut{color:var(--muted);pointer-events:none}
#cap{font-weight:500}
.sbtn{pointer-events:auto;cursor:pointer;appearance:none;border:1px solid var(--line);background:rgba(11,16,32,.78);color:var(--fg);border-radius:10px;padding:6px 10px;font:500 12.5px var(--body)}
.sbtn:hover{border-color:#5a6caa}
#panel{overflow-y:auto;min-height:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px}
.kicker{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h2{font:700 22px/1.15 var(--display);margin:0;text-wrap:balance}
h3{font:600 14px var(--body);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.ok{border-color:#2f7a4c}
.card.bad{border-color:#8a4350}
.btn{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:10px;padding:9px 14px;font:600 14px var(--body)}
.btn:hover{border-color:#5a6caa}
.btn.primary{background:var(--saluran);color:#06210f;border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:5px 9px;font:500 12.5px var(--body);display:flex;gap:6px;align-items:center}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip.seen{border-color:var(--c)}
.chip.seen::after{content:"✓";color:var(--ok);font-size:12px}
.chip.on{background:var(--panel);border-color:var(--fg)}
.bar{height:10px;border-radius:6px;background:#0b1020;border:1px solid var(--line);overflow:hidden}
.bar>b{display:block;height:100%;background:linear-gradient(90deg,var(--gangguan),var(--pesan),var(--saluran));transition:width .4s}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);padding:7px 6px;font:500 13px var(--body);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--fg)}
.seg button+button{border-left:1px solid var(--line)}
.tog{display:flex;gap:10px;align-items:center;cursor:pointer}
.tog input{accent-color:var(--umpan);width:18px;height:18px}
.log{font:500 12px/1.5 var(--mono);color:var(--muted);display:flex;flex-direction:column;gap:3px}
.log li{list-style:none}
ul.log{margin:0;padding:0}
.tag{display:inline-block;font:500 11px var(--mono);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.opt{appearance:none;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:10px;padding:9px 12px;font:500 14px/1.4 var(--body)}
.opt:hover:not(:disabled){border-color:#5a6caa}
.opt.right{border-color:var(--ok);background:#12301f}
.opt.wrong{border-color:var(--gangguan);background:#35161c}
.opts{display:flex;flex-direction:column;gap:7px}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat .card{gap:2px}
.stat b{font:700 22px var(--display)}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--saluran)}
.dots i.cur{background:var(--pesan)}
.dots i.bad{background:var(--gangguan)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
th{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.scroll-x{overflow-x:auto}
#stage.vr{position:fixed;inset:0;z-index:100;border-radius:0;border:0}
#vrui{display:none}
#stage.vr #vrui{display:block}
#stage.vr .hud{display:none}
.vrcap{position:absolute;bottom:14%;width:50%;text-align:center;color:#fff;font:600 14px var(--body);padding:0 8%;text-shadow:0 1px 3px #000;pointer-events:none}
.vrcap.l{left:0}.vrcap.r{left:50%}
.ret{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fff;border-radius:50%;opacity:.9;pointer-events:none}
.ret.l{left:25%}.ret.r{left:75%}
#vrexit{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:3}
.nogl{padding:24px;text-align:center;color:var(--muted)}
@media (max-width:880px){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(250px,42%) minmax(0,1fr)}
  h1{font-size:17px}
  .sub{display:none}
  header{flex-wrap:wrap}
  .brand{flex:1}
  .tools{order:2}
  #steps{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .step{white-space:nowrap;flex:none}
  .hud.top{flex-wrap:wrap}
  .hud.bot .pill.mut{display:none}
  .hud.bot{justify-content:flex-end}
  .pill{font-size:12px;padding:5px 8px}
}
@media (prefers-reduced-motion:reduce){.bar>b{transition:none}}
:focus-visible{outline:2px solid var(--pesan);outline-offset:2px}
</style>

<div id="app">

    <div class="brand"><div class="mark"></div><div><h1>Ruang Komunikasi 3D</h1><p class="sub">Pengantar Ilmu Komunikasi · Bab III</p></div></div>

  </main>
</div>

}

function setCam(p,instant){Object.assign(goal,p);if(instant)Object.assign(cam,p);}
function applyCam(){
  const k=.12;
  for(const f of ['theta','phi','r','tx','ty','tz'])cam[f]+=(goal[f]-cam[f])*k;
  const sp=Math.sin(cam.phi);
  camera.position.set(cam.tx+cam.r*sp*Math.sin(cam.theta),cam.ty+cam.r*Math.cos(cam.phi),cam.tz+cam.r*sp*Math.cos(cam.theta));
  camera.lookAt(cam.tx,cam.ty,cam.tz);
}

/* pointer */
const ptrs=new Map();let dragD=0,pinch0=0;
function onDown(e){canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragD=0;if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);}}
function onMove(e){
  const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){goal.theta-=dx*.006;goal.phi=clamp(goal.phi-dy*.005,.35,1.52);dragD+=Math.abs(dx)+Math.abs(dy);}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)goal.r=clamp(goal.r*pinch0/d,6,38);pinch0=d;dragD+=10;}
}
function onUp(e){
  const had=ptrs.delete(e.pointerId);
  if(had&&dragD<6&&ptrs.size===0)pickAt(e);
}
function ndcOf(e){const r=canvas.getBoundingClientRect();return new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);}
const ray=glOK?new THREE.Raycaster():null;
function visibleDeep(o){while(o){if(!o.visible)return false;o=o.parent;}return true;}
function pickAt(e){
  if(!glOK)return;
  const ndc=vr?new THREE.Vector2(0,0):ndcOf(e);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects([world,modelGroup],true);
  for(const h of hits){
    if(!visibleDeep(h.object))continue;
    let o=h.object;while(o&&!(o.userData&&o.userData.key))o=o.parent;
    if(o&&visibleDeep(o)){onPick(o);return;}
  }
}

/* ---------- MISI 3 ---------- */
const NODE_COL=[0x4f8cff,0xffb547,0x4fd18b,0xa493ff,0xff7a90];
function slotPos(m,i){
  const n=MODELS[m].nodes.length;
  if(MODELS[m].tipe==='ring'){const ang=[Math.PI,Math.PI/2,0,-Math.PI/2][i];return new THREE.Vector3(Math.cos(ang)*5.2,3.3+Math.sin(ang)*2.6,0);}
  const gap=n===5?3.35:3.9;return new THREE.Vector3((i-(n-1)/2)*gap,2.6,0);
}
function buildModel(key){
  modelGroup.traverse(o=>{const i=allLabels.indexOf(o);if(i>=0)allLabels.splice(i,1);});
  while(modelGroup.children.length)modelGroup.remove(modelGroup.children[0]);
  const M=MODELS[key],n=M.nodes.length;
  // urutan acak
  let perm;do{perm=shuffle([...Array(n).keys()]);}while(perm.filter((v,i)=>v===i).length>1);
  if(S.model.done.has(key))perm=[...Array(n).keys()];
  S.model.perm=perm;S.model.sel=null;S.model.hintText='';
  for(let i=0;i<n;i++){ // slot
    const pl=new THREE.Mesh(new THREE.BoxGeometry(2.7,1.5,.08),new THREE.MeshBasicMaterial({color:0x1c2547,transparent:true,opacity:.9}));
    pl.position.copy(slotPos(key,i));pl.position.z=-.35;modelGroup.add(pl);
    const ed=new THREE.LineSegments(new THREE.EdgesGeometry(pl.geometry),new THREE.LineBasicMaterial({color:0x3a4a80}));ed.position.copy(pl.position);modelGroup.add(ed);
  }
  // panah antar slot
  for(let i=0;i<(M.tipe==='ring'?n:n-1);i++){
    const a=slotPos(key,i),b=slotPos(key,(i+1)%n),d=b.clone().sub(a),len=d.length();d.normalize();
    const from=a.clone().addScaledVector(d,1.7),L=len-3.4;
    if(L>.3){const ar=new THREE.ArrowHelper(d,from,L,0x7f8fc4,.5,.4);ar.position.z=-.2;modelGroup.add(ar);}
  }
  // node
  for(let node=0;node<n;node++){
    const slot=perm.indexOf(node);
    const g=new THREE.Group();g.userData.key='node';g.userData.node=node;g.userData.hc=NODE_COL[node%5];
    const box=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.2,.5),std(NODE_COL[node%5],{emissive:NODE_COL[node%5],emissiveIntensity:.12}));
    g.add(box);
    const lb=labelSprite(M.nodes[node].t,'#'+NODE_COL[node%5].toString(16).padStart(6,'0'),M.nodes[node].s);lb.scale.set(2.5,.94,1);lb.position.set(0,0,.5);g.add(lb);
    g.position.copy(slotPos(key,slot));g.userData.target=g.position.clone();g.userData.slot=slot;
    modelGroup.add(g);
  }
  // dekorasi
  const mk=(txt,col,x,y)=>{const s=labelSprite(txt,col);s.scale.set(2.6,.98,1);s.position.set(x,y,0);modelGroup.add(s);return s;};
  if(M.decor==='noise'){const p=slotPos(key,2);mk('Sumber gangguan (noise)','#ff6b6b',p.x,p.y+2.2);
    const o=new THREE.Mesh(new THREE.OctahedronGeometry(.4),std(COL.gangguan,{emissive:COL.gangguan,emissiveIntensity:.5}));o.position.set(p.x,p.y+1.2,0);modelGroup.add(o);}
  if(M.decor==='berlo'){[0,3].forEach(si=>{const p=slotPos(key,si);['Kemampuan komunikasi','Pengetahuan','Sikap','Sistem sosial-budaya'].forEach((t,i)=>{const s=labelSprite(t,'#9aa7cc');s.scale.set(2.2,.82,1);s.position.set(p.x,p.y+1.45+i*.72,0);modelGroup.add(s);});});}
  modelGroup.userData.key2=key;
}
function modelSolved(){return S.model.perm.every((v,i)=>v===i);}
function curSlotOfNode(node){return modelGroup.children.find(c=>c.userData.key==='node'&&c.userData.node===node).userData.slot;}
function nodeObj(node){return modelGroup.children.find(c=>c.userData.key==='node'&&c.userData.node===node);}
function stage3(){
  const m=S.model,M=MODELS[m.key];
  const tabs=Object.keys(MODELS).map(k=>`<button class="chip ${m.key===k?'on':''} ${m.done.has(k)?'seen':''}" style="--c:var(--saluran)" data-act="model" data-k="${k}">${MODELS[k].nama.split(' (')[0]}</button>`).join('');
  const solved=m.done.has(m.key);
  const body=solved?`<div class="card ok"><h3>Urutan benar</h3><p class="small">${M.uraian}</p><p class="small"><span class="tag">ciri</span> ${M.ciri.join(' · ')}</p></div>`
   :`<div class="card"><p class="small">${M.uraian}</p></div><div class="card"><h3>Susun modelnya</h3><p class="small muted">Kotak di ruang 3D sudah teracak. Ketuk dua kotak untuk saling menukar posisi sampai urutan sesuai arah panah${M.tipe==='ring'?' (searah jarum jam, mulai dari kiri)':' (kiri ke kanan)'}.</p>${m.hintText?`<p class="small" style="color:var(--pesan)">${m.hintText}</p>`:''}</div>`;
  const all=m.done.size===4;
  return head(3,'Susun empat model komunikasi')+
   `<div class="chips">${tabs}</div>${body}
    <div class="row"><span class="small muted">Pertukaran: ${m.swaps} · Petunjuk: ${m.hints}</span>${solved?'':'<button class="btn ghost" data-act="hint">Beri petunjuk</button><button class="btn ghost" data-act="reshuffle">Acak ulang</button>'}</div>
    <div class="dots">${Object.keys(MODELS).map(k=>`<i class="${m.done.has(k)?'on':''}"></i>`).join('')}</div>
    <button class="btn primary" data-act="next" ${all?'':'disabled'}>${all?'Lanjut ke Lab AI':`Selesaikan ${4-m.done.size} model lagi`}</button>`;
}
function pickNode(o){
  const m=S.model;if(m.done.has(m.key))return;
  const node=o.userData.node;
  if(m.sel==null){m.sel=node;o.userData.sel=true;setHalo(o,60);setHud('Pilih kotak kedua untuk bertukar tempat');return;}
  if(m.sel===node){o.userData.sel=false;m.sel=null;setHalo(null);return;}
  const a=nodeObj(m.sel),b=o;const sa=a.userData.slot,sb=b.userData.slot;
  a.userData.slot=sb;b.userData.slot=sa;a.userData.target=slotPos(m.key,sb);b.userData.target=slotPos(m.key,sa);
  a.userData.sel=false;m.perm[sa]=node;m.perm[sb]=m.sel;
  // perm: slot -> node
  m.perm[sb]=m.sel;m.perm[sa]=node;
  m.sel=null;m.swaps++;m.hintText='';setHalo(null);
  if(modelSolved()){m.done.add(m.key);setHud('Model '+MODELS[m.key].nama+' tersusun benar');modelGroup.children.forEach(c=>{if(c.userData.key==='node'){c.userData.sel=false;}});}
  else setHud('Terus susun…');
  render();
}
function hint(){
  const m=S.model;m.hints++;

  const node=i;const o=nodeObj(node);setHalo(o,5);
  m.hintText=`Kotak "${MODELS[m.key].nodes[node].t}" seharusnya berada di posisi ke-${node+1}.`;setHud(m.hintText);render();
}

function buildQuestions(s){
  const qs=[];
  s.tugas_ketuk.slice(0,3).forEach(t=>qs.push({kind:'tap',target:t.target,prompt:`Ketuk objek 3D yang berperan sebagai ${NAMA[t.target].toUpperCase()}.`,petunjuk:t.petunjuk||INFO[t.target].ciri,penjelasan:t.penjelasan}));
  const jt=['fisik','psikologis','semantik'];
  qs.push({kind:'choose',prompt:`Jenis gangguan apa yang terjadi pada "${s.unsur.gangguan}"?`,opsi:jt.map(j=>NOISE[j].nama),benar:jt.indexOf(s.jenis_gangguan),penjelasan:s.penjelasan_gangguan+' ('+NOISE[s.jenis_gangguan].def+')'});
  const e=s.soal_tambahan;qs.push({kind:'choose',prompt:e.pertanyaan,opsi:e.opsi.slice(0,3),benar:e.benar,penjelasan:e.penjelasan});
  return qs;
}
function applyScenario(s){
  const u=s.unsur;
  KEYS.forEach(k=>{if(k!=='gangguan'){const g=U[k];setLabel(g.userData.label,u[k]);}});
  setLabel(U.labNoise.userData.label,u.gangguan);
  const A=ATMOS[s.suasana]||ATMOS.kelas;scene.background.setHex(A.bg);scene.fog.color.setHex(A.bg);U.ground.material.color.setHex(A.ground);
  const hue=Math.random();U.sumberBody.color.setHSL(hue,.62,.58);U.penMat[0].color.setHSL((hue+.35)%1,.55,.62);U.penMat[1].color.setHSL((hue+.5)%1,.5,.7);
  setChannel(s.jenis_saluran==='lisan'?'lisan':s.jenis_saluran==='tulisan'?'tulisan':'digital');
  U.labNoise.children[0].material.color.setHex({fisik:0xff6b6b,psikologis:0xb09cff,semantik:0xffd24a}[s.jenis_gangguan]);
}
function resetScenarioVisuals(){
  KEYS.forEach(k=>{const g=U[k]||null;if(g&&g.userData.label)setLabel(g.userData.label,PENDEK[k]);});
  noiseObjs.forEach(g=>setLabel(g.userData.label,g.userData.base));
  const A=ATMOS.kelas;scene.background.setHex(A.bg);scene.fog.color.setHex(A.bg);U.ground.material.color.setHex(A.ground);
  U.sumberBody.color.setHex(COL.sumber);U.penMat[0].color.setHex(COL.penerima);U.penMat[1].color.setHex(0xc3b8ff);
  setChannel('digital');
}
function validScenario(s){
  try{
    if(!s||typeof s!=='object')return false;
    if(!s.unsur||!KEYS.every(k=>typeof s.unsur[k]==='string'&&s.unsur[k].trim()))return false;
    if(!['fisik','psikologis','semantik'].includes(s.jenis_gangguan))return false;
    if(typeof s.judul!=='string'||typeof s.narasi!=='string'||typeof s.penjelasan_gangguan!=='string')return false;
    const tk=s.tugas_ketuk;if(!Array.isArray(tk)||tk.length<3)return false;
    const seen=new Set();for(const t of tk.slice(0,3)){if(!t||!KEYS.includes(t.target)||seen.has(t.target)||typeof t.penjelasan!=='string')return false;seen.add(t.target);}
    const e=s.soal_tambahan;if(!e||typeof e.pertanyaan!=='string'||!Array.isArray(e.opsi)||e.opsi.length<3||!e.opsi.every(o=>typeof o==='string')||!Number.isInteger(e.benar)||e.benar<0||e.benar>2||typeof e.penjelasan!=='string')return false;
    return true;
  }catch(e){return false;}
}
function normScenario(s){
  KEYS.forEach(k=>{s.unsur[k]=String(s.unsur[k]).trim().slice(0,44);});
  if(!ATMOS[s.suasana])s.suasana='kelas';
  s.judul=s.judul.slice(0,70);
  return s;
}
const AI_GUIDE=`Definisi unsur komunikasi menurut modul:
- Sumber (komunikator): pihak yang mengawali dan menyampaikan pesan.
- Pesan: simbol verbal maupun nonverbal yang mewakili gagasan, perasaan, atau informasi.
- Saluran (media): sarana penyampai pesan (suara, tulisan, media digital).
- Penerima (komunikan): pihak yang menerima dan menginterpretasikan pesan.
- Efek: dampak pada penerima setelah menerima pesan.
- Umpan balik: respons penerima yang kembali kepada sumber.
- Gangguan (noise): hambatan yang mendistorsi pesan; jenisnya fisik (suara bising, koneksi buruk), psikologis (takut, marah, bosan, tidak fokus), atau semantik (perbedaan pemahaman kata atau istilah).`;
async function generate(){
  const L=S.lab;L.err='';
  let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null;}catch(e){sample=null;}
  const useBank=(why)=>{const i=Math.floor(Math.random()*BANK.length);L.scn=normScenario(fromBank((L.seen.length+i)%BANK.length));L.source='offline';L.note=why;finishGen();};
  L.busy=true;L.ctl=new AbortController();render();
  if(!sample){return useBank('AI tidak tersedia di tampilan ini.');}
  const topik=L.topic==='acak'?'bebas (pilih konteks mahasiswa Indonesia yang berbeda dari judul sebelumnya)':TOPIK[L.topic];
  const lvl={mudah:'mudah: pilih 3 unsur yang mudah dikenali (sumber, pesan, saluran, penerima)',sedang:'sedang: campurkan unsur mudah dan satu dari efek atau umpan balik',sulit:'sulit: libatkan gangguan, efek, dan umpan balik; sertakan situasi yang agak mengecoh'}[L.level];
  const prompt=`Anda adalah perancang soal Pengantar Ilmu Komunikasi untuk mahasiswa Indonesia.
${AI_GUIDE}

Buat SATU skenario peristiwa komunikasi baru dengan tema: ${topik}. Tingkat: ${lvl}.
Hindari judul yang sudah dipakai: ${L.seen.join('; ')||'(belum ada)'}. Nomor variasi: ${Math.floor(Math.random()*1e6)}.
Aturan: bahasa Indonesia; semua teks pendek; setiap label di "unsur" maksimal 40 karakter, konkret, dan tidak memakai kata "sumber", "pesan", "saluran", dsb. sebagai isi; satu jenis gangguan yang jelas dan tidak ambigu; efek adalah perubahan pada penerima; umpan balik adalah respons penerima kepada sumber.
Balas HANYA satu objek JSON dengan bentuk persis:
{"judul":"...","suasana":"kelas|kafe|kampus_malam|medsos|lapangan","narasi":"2-3 kalimat","unsur":{"sumber":"...","pesan":"...","saluran":"...","penerima":"...","efek":"...","umpanbalik":"...","gangguan":"..."},"jenis_saluran":"lisan|tulisan|digital","jenis_gangguan":"fisik|psikologis|semantik","penjelasan_gangguan":"1 kalimat","tugas_ketuk":[{"target":"salah satu dari sumber,pesan,saluran,penerima,efek,umpanbalik,gangguan","petunjuk":"petunjuk tanpa menyebut jawaban","penjelasan":"1-2 kalimat mengapa label itu berperan sebagai unsur tersebut"}, ... tepat 3 target berbeda],"soal_tambahan":{"pertanyaan":"...","opsi":["...","...","..."],"benar":0,"penjelasan":"..."}}
"benar" adalah indeks 0-2 dari opsi yang tepat; acak posisi jawaban benar.`;
  try{
    const out=await sample.json(prompt,{signal:L.ctl.signal,cache:false});
    if(validScenario(out)){L.scn=normScenario(out);L.source='ai';L.aiCount++;finishGen();}
    else{useBank('Hasil AI tidak sesuai format, dipakai bank soal bawaan.');}
  }catch(e){
    if(e&&e.code==='cancelled'){L.busy=false;L.scn=null;render();return;}
    const m={not_granted:'Izin penggunaan AI tidak diberikan',rate_limited:'Batas penggunaan AI tercapai',session_expired:'Sesi berakhir, masuk ulang'}[e&&e.code]||'AI sedang tidak dapat dihubungi';
    useBank(m+'. Dipakai bank soal bawaan.');
  }
}
function finishGen(){
  const L=S.lab;L.busy=false;L.ctl=null;L.qs=buildQuestions(L.scn);L.qi=0;L.res=[];L.ans=null;L.hint=false;L.seen.push(L.scn.judul);
  applyScenario(L.scn);labSceneState();enterQuestion();render();
}
function labSceneState(){
  noiseObjs.forEach(g=>g.userData.show=false);U.labNoise.visible=true;setCam(presetMain());
}
function enterQuestion(){
  const L=S.lab,q=L.qs[L.qi];setHalo(null);
  if(q){setHud(q.kind==='tap'?q.prompt:'Jawab di panel, atau keluar dari mode VR.');}
  setMission('Lab AI · '+(L.scn?L.scn.judul:'buat skenario'));
}
function answerTap(o){
  const L=S.lab,q=L.qs[L.qi];if(!q||q.kind!=='tap'||L.ans)return;
  const ok=o.userData.key===q.target;L.ans={ok};L.res[L.qi]=ok;L.total++;if(ok)L.correct++;
  const t=q.target==='gangguan'?U.labNoise:U[q.target];t.userData.hc=ok?0x5be28a:0xffffff;setHalo(t,8);
  if(!ok){setHud('Objek yang tepat ditandai putih.');}else setHud('Tepat!');
  render();
}
function answerOpt(i){
  const L=S.lab,q=L.qs[L.qi];if(!q||q.kind!=='choose'||L.ans)return;
  const ok=i===q.benar;L.ans={ok,idx:i};L.res[L.qi]=ok;L.total++;if(ok)L.correct++;render();
}

/* ---------- HASIL ---------- */
function stage5(){
  const s=S.sim,m=S.model,L=S.lab;
  const el=fmt((S.finished?S.tEnd:Date.now())-S.t0);
  const pct=L.total?Math.round(L.correct/L.total*100):0;
  return `<p class="kicker">Selesai</p><h2>Anda sudah menjelajahi satu peristiwa komunikasi utuh</h2>
   <div class="stat">
    <div class="card"><span class="small muted">Waktu belajar</span><b>${el}</b></div>
    <div class="card"><span class="small muted">Unsur dijelajahi</span><b>${S.visited.size}/7</b></div>
    <div class="card"><span class="small muted">Kejelasan pesan terbaik</span><b>${s.best}%</b></div>
    <div class="card"><span class="small muted">Model tersusun</span><b>${m.done.size}/4</b></div>
    <div class="card"><span class="small muted">Jawaban Lab AI benar</span><b>${L.correct}/${L.total}</b></div>
    <div class="card"><span class="small muted">Skenario AI</span><b>${L.aiCount}</b></div>
   </div>
   <div class="card"><h3>Rangkuman</h3>
    <p class="small">Komunikasi adalah proses: sumber mengirim pesan lewat saluran kepada penerima, menimbulkan efek, dan memicu umpan balik, sementara gangguan fisik, psikologis, dan semantik dapat mendistorsi pesan di tengah jalan.</p></div>
   <div class="card scroll-x"><h3>Empat model sekilas</h3><table><thead><tr><th>Model</th><th>Ciri utama</th></tr></thead><tbody>${Object.values(MODELS).map(M=>`<tr><td>${M.nama}</td><td>${M.ciri.join('; ')}</td></tr>`).join('')}</tbody></table></div>
   <button class="btn" data-act="restart">Ulangi dari awal</button>`;
}

/* ===================== NAVIGASI & EVENT ===================== */
function applyStageScene(){
  const n=S.stage;
  setHalo(null);resetScenarioVisuals();
  noiseObjs.forEach(g=>{g.userData.show=(n!==2&&n!==3);});
  U.labNoise.visible=false;modelGroup.visible=(n===2);world.visible=(n!==2);
  U.pesan.visible=true;packet.visible=false;retPacket.visible=false;anim=null;S.sim.busy=false;
  if(n===0){setCam(presetMain());setMission('Misi 1 · Jelajahi 7 unsur');setHud('');}
  else if(n===1){setCam(presetMain());setMission('Misi 2 · Atasi gangguan, kirim pesan');setHud('');}
  else if(n===2){buildModel(S.model.key);setCam(presetModel(),true);setMission('Misi 3 · Susun model komunikasi');setHud('Ketuk dua kotak untuk bertukar posisi.');}
  else if(n===3){setMission('Misi 4 · Lab skenario AI');setHud('');setCam(presetMain());
    if(S.lab.scn){applyScenario(S.lab.scn);labSceneState();enterQuestion();}}
  else if(n===4){setCam(presetMain());setMission('Selesai · terima kasih telah belajar');setHud('');}
}
function go(n){S.stage=n;applyStageScene();render();panel.scrollTop=0;}
function onPick(o){
  const key=o.userData.key;
  if(!S.started)return;
  if(vr&&S.stage!==0){ if(key==='node')setHud(MODELS[S.model.key].nodes[o.userData.node].t);else setHud(NAMA[key]||'');return;}
  if(S.stage===0){
    if(key==='gangguan')selectKey('gangguan',o.userData.type,o);else selectKey(key,null,o);
  }else if(S.stage===1){
    if(key==='gangguan')handleNoise(o);else{setHalo(o,3);setHud(NAMA[key]);}
  }else if(S.stage===2){
    if(key==='node')pickNode(o);
  }else if(S.stage===3){
    if(S.lab.scn&&!S.lab.busy)answerTap(o);
  }
}
panel.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,L=S.lab;
  if(a==='start'){S.started=true;S.t0=Date.now();go(0);}
  else if(a==='chip'){const k=b.dataset.k;selectKey(k,null,k==='gangguan'?noiseObjs[0]:U[k]);}
  else if(a==='next'){const nx=S.stage+1;S.max=Math.max(S.max,nx);if(nx===4){S.finished=true;S.tEnd=Date.now();}go(nx);}
  else if(a==='chan'){setChannel(b.dataset.v);render();}
  else if(a==='send')startSend();
  else if(a==='resetnoise'){noiseObjs.forEach(g=>{g.userData.handled=false;});S.sim.handled.clear();S.sim.log.push('Gangguan dimunculkan kembali.');render();}
  else if(a==='model'){S.model.key=b.dataset.k;buildModel(S.model.key);setCam(presetModel());setHalo(null);render();}
  else if(a==='hint')hint();
  else if(a==='reshuffle'){buildModel(S.model.key);setHalo(null);render();}
  else if(a==='level'){L.level=b.dataset.v;render();}
  else if(a==='gen'||a==='again'){if(a==='again'){L.scn=null;L.finishedScn=false;resetScenarioVisuals();}generate();}
  else if(a==='cancelgen'){L.ctl&&L.ctl.abort();}
  else if(a==='lhint'){L.hint=true;const q=L.qs[L.qi];setHud('Petunjuk: '+q.petunjuk);render();}
  else if(a==='opt')answerOpt(+b.dataset.i);
  else if(a==='nextq'){
    L.qi++;L.ans=null;L.hint=false;setHalo(null);
    if(L.qi>=L.qs.length){L.done++;}
    enterQuestion();render();
  }
  else if(a==='restart'){location.reload();}
});
panel.addEventListener('change',e=>{
  if(e.target.id==='fbTog'){S.sim.feedback=e.target.checked;render();}
  if(e.target.id==='topicSel'){S.lab.topic=e.target.value;}
});
$('#steps').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b||b.disabled)return;const n=+b.dataset.go;if(n===4&&!S.finished){S.finished=true;S.tEnd=Date.now();}go(n);});
$('#camReset').addEventListener('click',()=>{setCam(S.stage===2?presetModel():presetMain());});
$('#vrBtn').addEventListener('click',()=>setVR(true));
$('#vrexit').addEventListener('click',()=>setVR(false));

/* ===================== MULAI ===================== */
S.hud='';
if(glOK){
  resize();setCam(presetMain(),true);applyCam();
  setMission('Selamat datang di ruang komunikasi');
  document.fonts&&document.fonts.ready.then(()=>allLabels.forEach(drawLabel));
  loop();
}
render();
window.__app={S,go,U,noiseObjs,onPick,generate};
})();
</script>
